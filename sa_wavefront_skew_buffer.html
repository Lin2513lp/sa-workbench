.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;sa-wavefront-animation&quot;&gt;
  &lt;style&gt;
    #sa-wavefront-animation {
      width: 100%;
      color: var(--foreground);
    }

    #sa-wavefront-animation .sa-controls {
      align-items: end;
      margin-bottom: 0.75rem;
    }

    #sa-wavefront-animation .sa-clock-control {
      flex: 1 1 300px;
      min-width: 0;
    }

    #sa-wavefront-animation .sa-speed-control {
      flex: 0 1 110px;
    }

    #sa-wavefront-animation .sa-milestones {
      margin-bottom: 1rem;
    }

    #sa-wavefront-animation .sa-section {
      margin: 0.7rem 0;
    }

    #sa-wavefront-animation .sa-section-label {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.35rem 0.75rem;
      margin-bottom: 0.35rem;
      font-weight: 500;
    }

    #sa-wavefront-animation .sa-direction {
      color: var(--muted-foreground);
      font-weight: 400;
    }

    #sa-wavefront-animation .sa-raw-bus {
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 3px;
      width: 100%;
    }

    #sa-wavefront-animation .sa-raw-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      height: clamp(26px, 5vw, 40px);
      border: 1px solid var(--border);
      border-radius: 2px;
      background: color-mix(in srgb, var(--muted) 44%, transparent);
      color: var(--muted-foreground);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #sa-wavefront-animation .sa-raw-cell[data-active=&quot;true&quot;] {
      border-color: color-mix(in srgb, var(--viz-series-1) 70%, var(--border));
      background: var(--viz-series-1);
      color: var(--foreground);
    }

    #sa-wavefront-animation .sa-skew-bank {
      display: grid;
      grid-template-columns: 38px repeat(16, minmax(0, 1fr));
      gap: 2px;
      width: 100%;
    }

    #sa-wavefront-animation .sa-skew-label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 18px;
      color: var(--muted-foreground);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    #sa-wavefront-animation .sa-skew-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      height: clamp(18px, 3.8vw, 30px);
      border: 1px solid transparent;
      border-radius: 2px;
      color: var(--foreground);
      font-size: 11px;
      white-space: nowrap;
    }

    #sa-wavefront-animation .sa-skew-stage[data-path=&quot;true&quot;] {
      border-color: var(--border);
      background: color-mix(in srgb, var(--muted) 44%, transparent);
    }

    #sa-wavefront-animation .sa-skew-stage[data-token=&quot;true&quot;] {
      border-color: color-mix(in srgb, var(--viz-series-1) 70%, var(--border));
      background: var(--viz-series-1);
    }

    #sa-wavefront-animation .sa-skew-stage[data-output=&quot;true&quot;] {
      box-shadow: inset 0 0 0 2px var(--foreground);
    }

    #sa-wavefront-animation .sa-schedule {
      display: grid;
      grid-template-columns: 38px repeat(31, minmax(0, 1fr));
      gap: 2px;
      width: 100%;
    }

    #sa-wavefront-animation .sa-time-label,
    #sa-wavefront-animation .sa-lane-label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 14px;
      color: var(--muted-foreground);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    #sa-wavefront-animation .sa-time-label {
      align-items: end;
    }

    #sa-wavefront-animation .sa-lane-label {
      justify-content: flex-end;
      padding-right: 4px;
    }

    #sa-wavefront-animation .sa-slot {
      min-width: 0;
      height: clamp(11px, 2.25vw, 18px);
      border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      background: transparent;
    }

    #sa-wavefront-animation .sa-slot[data-valid=&quot;true&quot;] {
      border-color: color-mix(in srgb, var(--viz-series-1) 36%, var(--border));
      background: color-mix(in srgb, var(--viz-series-1) 18%, transparent);
    }

    #sa-wavefront-animation .sa-output-schedule .sa-slot[data-valid=&quot;true&quot;] {
      border-color: color-mix(in srgb, var(--viz-series-2) 38%, var(--border));
      background: color-mix(in srgb, var(--viz-series-2) 18%, transparent);
    }

    #sa-wavefront-animation .sa-slot[data-state=&quot;past&quot;] {
      opacity: 0.42;
    }

    #sa-wavefront-animation .sa-slot[data-state=&quot;current&quot;] {
      border-color: var(--foreground);
      background: var(--viz-series-1);
      opacity: 1;
    }

    #sa-wavefront-animation .sa-output-schedule .sa-slot[data-state=&quot;current&quot;] {
      background: var(--viz-series-2);
    }

    #sa-wavefront-animation .sa-slot[data-column=&quot;current&quot;]:not([data-valid=&quot;true&quot;]) {
      background: color-mix(in srgb, var(--muted) 62%, transparent);
    }

    #sa-wavefront-animation .sa-flow-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 32px;
      color: var(--muted-foreground);
    }

    #sa-wavefront-animation .sa-array-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.55rem;
      align-items: center;
      max-width: 620px;
      margin: 0 auto;
    }

    #sa-wavefront-animation .sa-array {
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 3px;
      width: 100%;
      aspect-ratio: 1;
    }

    #sa-wavefront-animation .sa-pe {
      min-width: 0;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: color-mix(in srgb, var(--muted) 44%, transparent);
      color: var(--foreground);
      cursor: pointer;
    }

    #sa-wavefront-animation .sa-pe[data-active=&quot;true&quot;] {
      border-color: color-mix(in srgb, var(--viz-series-1) 70%, var(--border));
      background: var(--viz-series-1);
    }

    #sa-wavefront-animation .sa-pe[data-output=&quot;true&quot;] {
      border-color: color-mix(in srgb, var(--viz-series-2) 76%, var(--border));
      background: var(--viz-series-2);
    }

    #sa-wavefront-animation .sa-pe[data-selected=&quot;true&quot;] {
      box-shadow: inset 0 0 0 2px var(--foreground);
    }

    #sa-wavefront-animation .sa-array-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      color: var(--muted-foreground);
      writing-mode: vertical-rl;
    }

    #sa-wavefront-animation .sa-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem 1rem;
      margin-top: 0.55rem;
      color: var(--muted-foreground);
    }

    #sa-wavefront-animation .sa-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    #sa-wavefront-animation .sa-swatch {
      width: 13px;
      height: 13px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: color-mix(in srgb, var(--muted) 44%, transparent);
    }

    #sa-wavefront-animation .sa-swatch-a {
      background: var(--viz-series-1);
    }

    #sa-wavefront-animation .sa-swatch-c {
      background: var(--viz-series-2);
    }

    #sa-wavefront-animation .sa-readout {
      margin-top: 0.8rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border);
      color: var(--foreground);
    }

    #sa-wavefront-animation .sa-readout code {
      white-space: normal;
    }

    @media (max-width: 520px) {
      #sa-wavefront-animation .sa-schedule {
        grid-template-columns: 28px repeat(31, minmax(0, 1fr));
        gap: 1px;
      }

      #sa-wavefront-animation .sa-time-label:nth-child(n) {
        color: transparent;
      }

      #sa-wavefront-animation .sa-time-label[data-major=&quot;true&quot;] {
        color: var(--muted-foreground);
      }

      #sa-wavefront-animation .sa-array {
        gap: 2px;
      }

      #sa-wavefront-animation .sa-array-shell {
        grid-template-columns: minmax(0, 1fr);
      }

      #sa-wavefront-animation .sa-array-side {
        flex-direction: row;
        justify-content: center;
        writing-mode: horizontal-tb;
      }

      #sa-wavefront-animation .sa-raw-cell span {
        display: none;
      }

      #sa-wavefront-animation .sa-skew-bank {
        grid-template-columns: 28px repeat(16, minmax(0, 1fr));
        gap: 1px;
      }

      #sa-wavefront-animation .sa-skew-stage span {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #sa-wavefront-animation * {
        scroll-behavior: auto;
      }
    }
  &lt;/style&gt;

  &lt;div class=&quot;viz-controls sa-controls&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;sa-wave-play&quot;&gt;
      &lt;i data-lucide=&quot;play&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
      &lt;span&gt;播放&lt;/span&gt;
    &lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;sa-wave-prev&quot; aria-label=&quot;上一拍&quot; data-tooltip=&quot;上一拍&quot;&gt;
      &lt;i data-lucide=&quot;step-back&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
    &lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;sa-wave-next&quot; aria-label=&quot;下一拍&quot; data-tooltip=&quot;下一拍&quot;&gt;
      &lt;i data-lucide=&quot;step-forward&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
    &lt;/button&gt;
    &lt;label class=&quot;form-label sa-clock-control&quot;&gt;
      时钟：&lt;span id=&quot;sa-wave-clock&quot;&gt;权重已装载，等待 A&lt;/span&gt;
      &lt;input class=&quot;form-range&quot; id=&quot;sa-wave-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;46&quot; value=&quot;0&quot; step=&quot;1&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label sa-speed-control&quot;&gt;
      速度
      &lt;select class=&quot;form-select&quot; id=&quot;sa-wave-speed&quot;&gt;
        &lt;option value=&quot;1200&quot;&gt;0.5×&lt;/option&gt;
        &lt;option value=&quot;700&quot; selected&gt;1×&lt;/option&gt;
        &lt;option value=&quot;350&quot;&gt;2×&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;

  &lt;div class=&quot;viz-row sa-milestones&quot; aria-label=&quot;关键拍&quot;&gt;

    &lt;/div&gt;

      &lt;span class=&quot;sa-legend-item&quot;&gt;&lt;i class=&quot;sa-swatch sa-swatch-a&quot;&gt;&lt;/i&gt;本拍 MAC / A 波前&lt;/span&gt;
      &lt;span class=&quot;sa-legend-item&quot;&gt;&lt;i class=&quot;sa-swatch sa-swatch-c&quot;&gt;&lt;/i&gt;底部产生 C&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;sa-flow-arrow&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;span&gt;底部原始结果&lt;/span&gt;
    &lt;i data-lucide=&quot;arrow-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
    &lt;span&gt;按列错拍流出&lt;/span&gt;
  &lt;/div&gt;

  &lt;section class=&quot;sa-section&quot; aria-labelledby=&quot;sa-wave-output-label&quot;&gt;
    &lt;div class=&quot;sa-section-label&quot;&gt;
      &lt;span id=&quot;sa-wave-output-label&quot;&gt;C 底部输出阶梯&lt;/span&gt;
      &lt;span class=&quot;sa-direction&quot;&gt;&lt;code&gt;C[i][j]&lt;/code&gt; 在第 &lt;code&gt;16+i+j&lt;/code&gt; 拍出现&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;sa-wave-output&quot; class=&quot;sa-schedule sa-output-schedule&quot; role=&quot;img&quot; aria-label=&quot;C结果从16个底部输出列错拍流出的时序&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div id=&quot;sa-wave-readout&quot; class=&quot;sa-readout text-small&quot; aria-live=&quot;polite&quot;&gt;
    B 已固定在256个PE中；拖动时钟开始观察 A 波前。
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;sa-wavefront-animation&quot;);
      if (!root) return;

      const size = 16;
      const finalBeat = 46;
      const inputStartBeat = 1;
      const outputStartBeat = 16;
      const rawBus = root.querySelector(&quot;#sa-wave-raw&quot;);
      const rawStatus = root.querySelector(&quot;#sa-wave-raw-status&quot;);
      const skewBank = root.querySelector(&quot;#sa-wave-skew&quot;);
      const inputGrid = root.querySelector(&quot;#sa-wave-input&quot;);
      const outputGrid = root.querySelector(&quot;#sa-wave-output&quot;);
      const arrayGrid = root.querySelector(&quot;#sa-wave-array&quot;);
      const range = root.querySelector(&quot;#sa-wave-range&quot;);
      const clock = root.querySelector(&quot;#sa-wave-clock&quot;);
      const readout = root.querySelector(&quot;#sa-wave-readout&quot;);
      const playButton = root.querySelector(&quot;#sa-wave-play&quot;);
      const playText = playButton.querySelector(&quot;span&quot;);
      const speed = root.querySelector(&quot;#sa-wave-speed&quot;);
      const prevButton = root.querySelector(&quot;#sa-wave-prev&quot;);
      const nextButton = root.querySelector(&quot;#sa-wave-next&quot;);
      const rawCells = [];
      const skewCells = [];
      const inputSlots = [];
      const outputSlots = [];
      const peCells = [];
      let beat = 0;
      let timer = null;
      let selected = null;

      const majorInputTicks = new Set([1, 8, 16, 24, 31]);
      const majorOutputTicks = new Set([16, 23, 31, 39, 46]);

      for (let k = 0; k &lt; size; k += 1) {
        const cell = document.createElement(&quot;span&quot;);
        cell.className = &quot;sa-raw-cell&quot;;
        cell.dataset.k = String(k);
        cell.dataset.active = &quot;false&quot;;
        cell.innerHTML = `&lt;span&gt;—&lt;/span&gt;`;
        cell.setAttribute(&quot;aria-label&quot;, `总线 lane ${k} 空闲`);
        rawBus.appendChild(cell);
        rawCells.push(cell);
      }

      const skewCorner = document.createElement(&quot;span&quot;);
      skewCorner.className = &quot;sa-skew-label&quot;;
      skewCorner.textContent = &quot;lane&quot;;
      skewBank.appendChild(skewCorner);

      for (let stage = 0; stage &lt; size; stage += 1) {
        const label = document.createElement(&quot;span&quot;);
        label.className = &quot;sa-skew-label&quot;;
        label.textContent = `d${stage}`;
        skewBank.appendChild(label);
      }

      for (let k = 0; k &lt; size; k += 1) {
        const laneLabel = document.createElement(&quot;span&quot;);
        laneLabel.className = &quot;sa-skew-label&quot;;
        laneLabel.textContent = `k${k}`;
        skewBank.appendChild(laneLabel);

        for (let stage = 0; stage &lt; size; stage += 1) {
          const path = stage &lt;= k;
          const cell = document.createElement(&quot;span&quot;);
          cell.className = &quot;sa-skew-stage&quot;;
          cell.dataset.k = String(k);
          cell.dataset.stage = String(stage);
          cell.dataset.path = String(path);
          cell.dataset.token = &quot;false&quot;;
          cell.dataset.output = &quot;false&quot;;
          cell.innerHTML = &quot;&lt;span&gt;&lt;/span&gt;&quot;;
          cell.setAttribute(
            &quot;aria-label&quot;,
            path ? `lane ${k} 的第 ${stage} 级延迟寄存器为空` : `lane ${k} 不需要第 ${stage} 级延迟`
          );
          skewBank.appendChild(cell);
          skewCells.push(cell);
        }
      }

      function addScheduleHeader(grid, startBeat, majorTicks) {
        const corner = document.createElement(&quot;span&quot;);
        corner.className = &quot;sa-time-label&quot;;
        corner.textContent = &quot;lane&quot;;
        grid.appendChild(corner);

        for (let offset = 0; offset &lt; 31; offset += 1) {
          const t = startBeat + offset;
          const label = document.createElement(&quot;span&quot;);
          label.className = &quot;sa-time-label&quot;;
          label.dataset.major = String(majorTicks.has(t));
          label.textContent = majorTicks.has(t) ? String(t) : &quot;·&quot;;
          grid.appendChild(label);
        }
      }

      addScheduleHeader(inputGrid, inputStartBeat, majorInputTicks);
      for (let k = 0; k &lt; size; k += 1) {
        const lane = document.createElement(&quot;span&quot;);
        lane.className = &quot;sa-lane-label&quot;;
        lane.textContent = `k${k}`;
        inputGrid.appendChild(lane);

        for (let t = 1; t &lt;= 31; t += 1) {
          const i = t - 1 - k;
          const valid = i &gt;= 0 &amp;&amp; i &lt; size;
          const slot = document.createElement(&quot;span&quot;);
          slot.className = &quot;sa-slot&quot;;
          slot.dataset.valid = String(valid);
          slot.dataset.beat = String(t);
          slot.setAttribute(&quot;aria-label&quot;, valid ? `第${t}拍，lane ${k} 输入 A ${i},${k}` : `第${t}拍，lane ${k} 空`);
          inputGrid.appendChild(slot);
          inputSlots.push(slot);
        }
      }

      addScheduleHeader(outputGrid, outputStartBeat, majorOutputTicks);
      for (let j = 0; j &lt; size; j += 1) {
        const lane = document.createElement(&quot;span&quot;);
        lane.className = &quot;sa-lane-label&quot;;
        lane.textContent = `j${j}`;
        outputGrid.appendChild(lane);

        for (let t = 16; t &lt;= 46; t += 1) {
          const i = t - 16 - j;
          const valid = i &gt;= 0 &amp;&amp; i &lt; size;
          const slot = document.createElement(&quot;span&quot;);
          slot.className = &quot;sa-slot&quot;;
          slot.dataset.valid = String(valid);
          slot.dataset.beat = String(t);
          slot.setAttribute(&quot;aria-label&quot;, valid ? `第${t}拍，底部第${j}列输出 C ${i},${j}` : `第${t}拍，底部第${j}列无输出`);
          outputGrid.appendChild(slot);
          outputSlots.push(slot);
        }
      }

      for (let k = 0; k &lt; size; k += 1) {
        for (let j = 0; j &lt; size; j += 1) {
          const pe = document.createElement(&quot;button&quot;);
          pe.type = &quot;button&quot;;
          pe.className = &quot;sa-pe&quot;;
          pe.dataset.k = String(k);
          pe.dataset.j = String(j);
          pe.dataset.active = &quot;false&quot;;
          pe.dataset.output = &quot;false&quot;;
          pe.dataset.selected = &quot;false&quot;;
          pe.setAttribute(&quot;role&quot;, &quot;gridcell&quot;);
          pe.addEventListener(&quot;click&quot;, () =&gt; {
            selected = { k, j };
            render(beat);
          });
          arrayGrid.appendChild(pe);
          peCells.push(pe);
        }
      }

      function updateSchedule(slots, currentBeat) {
        slots.forEach((slot) =&gt; {
          const slotBeat = Number(slot.dataset.beat);
          const valid = slot.dataset.valid === &quot;true&quot;;
          slot.dataset.column = slotBeat === currentBeat ? &quot;current&quot; : &quot;&quot;;
          slot.dataset.state = !valid
            ? &quot;empty&quot;
            : slotBeat &lt; currentBeat
              ? &quot;past&quot;
              : slotBeat === currentBeat
                ? &quot;current&quot;
                : &quot;future&quot;;
        });
      }

      function render(nextBeat) {
        beat = Math.max(0, Math.min(finalBeat, nextBeat));
        range.value = String(beat);
        clock.textContent = beat === 0 ? &quot;权重已装载，等待 A&quot; : `第 ${beat} / ${finalBeat} 拍`;

        updateSchedule(inputSlots, beat);
        updateSchedule(outputSlots, beat);

        let activeCount = 0;
        const entering = [];
        const outputs = [];
        const rawRow = beat - 1;
        const rawActive = rawRow &gt;= 0 &amp;&amp; rawRow &lt; size;

        rawCells.forEach((cell) =&gt; {
          const k = Number(cell.dataset.k);
          cell.dataset.active = String(rawActive);
          cell.querySelector(&quot;span&quot;).textContent = rawActive ? `A${rawRow},${k}` : &quot;—&quot;;
          cell.setAttribute(
            &quot;aria-label&quot;,
            rawActive ? `第${beat}拍，总线 lane ${k} 输入 A ${rawRow},${k}` : `第${beat}拍，总线 lane ${k} 空闲`
          );
        });

        rawStatus.textContent = rawActive
          ? `第${beat}拍：A[${rawRow}][0…15] 共16个元素同时有效`
          : beat === 0
            ? &quot;每拍同时输入一整行16个元素&quot;
            : &quot;原始16行已经送完，错位缓冲仍在排空&quot;;

        skewCells.forEach((cell) =&gt; {
          const k = Number(cell.dataset.k);
          const stage = Number(cell.dataset.stage);
          const path = cell.dataset.path === &quot;true&quot;;
          const i = beat - 1 - stage;
          const token = beat &gt; 0 &amp;&amp; path &amp;&amp; i &gt;= 0 &amp;&amp; i &lt; size;
          const output = token &amp;&amp; stage === k;
          cell.dataset.token = String(token);
          cell.dataset.output = String(output);
          cell.querySelector(&quot;span&quot;).textContent = token ? `A${i},${k}` : &quot;&quot;;
          cell.setAttribute(
            &quot;aria-label&quot;,
            !path
              ? `lane ${k} 不需要第 ${stage} 级延迟`
              : token
                ? `第${beat}拍，lane ${k} 的第${stage}级保存 A ${i},${k}${output ? &quot;，本拍送入PE行入口&quot; : &quot;&quot;}`
                : `第${beat}拍，lane ${k} 的第${stage}级为空`
          );
        });

        for (let k = 0; k &lt; size; k += 1) {
          const inputI = beat - 1 - k;
          if (inputI &gt;= 0 &amp;&amp; inputI &lt; size) entering.push(`A[${inputI}][${k}]`);
        }

        peCells.forEach((pe) =&gt; {
          const k = Number(pe.dataset.k);
          const j = Number(pe.dataset.j);
          const i = beat - 1 - k - j;
          const active = beat &gt; 0 &amp;&amp; i &gt;= 0 &amp;&amp; i &lt; size;
          const output = active &amp;&amp; k === size - 1;
          const isSelected = selected &amp;&amp; selected.k === k &amp;&amp; selected.j === j;

          pe.dataset.active = String(active);
          pe.dataset.output = String(output);
          pe.dataset.selected = String(Boolean(isSelected));

          if (active) activeCount += 1;
          if (output) outputs.push(`C[${i}][${j}]`);

          const operation = active
            ? `第${beat}拍，PE ${k},${j}：A[${i}][${k}] × B[${k}][${j}]，累加到 C[${i}][${j}]`
            : `第${beat}拍，PE ${k},${j} 空闲，B[${k}][${j}] 固定`;
          pe.setAttribute(&quot;aria-label&quot;, operation);
        });

        let message;
        if (beat === 0) {
          message = &quot;B 已固定在256个PE中；A总线每拍准备送入一整行16个元素。&quot;;
        } else {
          const rawText = rawActive
            ? `512-bit总线同时送入 A[${rawRow}][0…15]`
            : &quot;512-bit总线本拍空闲&quot;;
          const inputText = entering.length
            ? `经INPUT_SKEW后有${entering.length}个 A 元素进入不同PE行`
            : &quot;错位后的 A 已全部进入&quot;;
          const outputText = outputs.length === 1
            ? `底部输出 ${outputs[0]}`
            : outputs.length &gt; 1
              ? `底部输出${outputs.length}个结果（${outputs[0]} … ${outputs[outputs.length - 1]}）`
              : &quot;底部尚无新结果&quot;;
          message = `第${beat}拍：${rawText}；${inputText}；${activeCount}个 PE 执行 MAC；${outputText}。`;
        }

        if (selected) {
          const i = beat - 1 - selected.k - selected.j;
          const peText = i &gt;= 0 &amp;&amp; i &lt; size
            ? `PE[${selected.k}][${selected.j}] 正在计算 A[${i}][${selected.k}] × B[${selected.k}][${selected.j}]，目标是 C[${i}][${selected.j}]。`
            : `PE[${selected.k}][${selected.j}] 本拍空闲，内部仍固定保存 B[${selected.k}][${selected.j}]。`;
          message += ` ${peText}`;
        }

        readout.textContent = message;
        prevButton.disabled = beat === 0;
        nextButton.disabled = beat === finalBeat;

        root.querySelectorAll(&quot;[data-wave-beat]&quot;).forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(Number(button.dataset.waveBeat) === beat));
        });
      }

      function stop() {
        if (timer !== null) {
          window.clearInterval(timer);
          timer = null;
        }
        playButton.classList.add(&quot;btn-primary&quot;);
        playText.textContent = &quot;播放&quot;;
        playButton.querySelector(&quot;svg, i&quot;)?.setAttribute(&quot;data-lucide&quot;, &quot;play&quot;);
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function start() {
        if (beat &gt;= finalBeat) render(0);
        playText.textContent = &quot;暂停&quot;;
        playButton.querySelector(&quot;svg, i&quot;)?.setAttribute(&quot;data-lucide&quot;, &quot;pause&quot;);
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        timer = window.setInterval(() =&gt; {
          if (beat &gt;= finalBeat) {
            stop();
            return;
          }
          render(beat + 1);
        }, Number(speed.value));
      }

      playButton.addEventListener(&quot;click&quot;, () =&gt; {
        if (timer === null) start();
        else stop();
      });
      prevButton.addEventListener(&quot;click&quot;, () =&gt; {
        stop();
        render(beat - 1);
      });
      nextButton.addEventListener(&quot;click&quot;, () =&gt; {
        stop();
        render(beat + 1);
      });
      range.addEventListener(&quot;input&quot;, () =&gt; {
        stop();
        render(Number(range.value));
      });
      speed.addEventListener(&quot;change&quot;, () =&gt; {
        if (timer !== null) {
          stop();
          start();
        }
      });
      root.querySelectorAll(&quot;[data-wave-beat]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          stop();
          render(Number(button.dataset.waveBeat));
        });
      });

      render(0);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
