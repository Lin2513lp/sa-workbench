<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA_TOP 仿真波形</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #64748b;
      --line: #d7dde7;
      --blue: #1d4ed8;
      --blue-soft: #eef5ff;
      --green: #047857;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    header {
      padding: 22px 24px 17px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0;
    }

    header p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      width: min(1480px, calc(100% - 32px));
      margin: 20px auto 36px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .tab {
      min-width: 90px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #334155;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    .tab.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: var(--blue);
    }

    .wave-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.07);
    }

    .wave-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
    }

    .wave-title {
      margin: 0;
      font-size: 18px;
    }

    .wave-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .tag {
      padding: 3px 7px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      color: #475569;
      font-size: 12px;
    }

    .tag.pass {
      border-color: #a7f3d0;
      background: #ecfdf5;
      color: var(--green);
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .tool,
    .open-link, .open-link-style {
      display: inline-grid;
      min-width: 34px;
      height: 34px;
      place-items: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #334155;
      font: inherit;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }

    .tool:hover,
    .open-link:hover { border-color: #94a3b8; }

    .viewport {
      overflow: auto;
      min-height: 330px;
      padding: 14px;
      background: #0b0f13;
    }

    .viewport img {
      display: block;
      width: 2048px;
      max-width: none;
      height: auto;
      transform-origin: left top;
    }

    .caption {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      padding: 14px 18px 16px;
      border-top: 1px solid var(--line);
      color: #475569;
      font-size: 14px;
      line-height: 1.7;
    }

    .caption b { color: var(--ink); }

    .check-count {
      align-self: start;
      color: var(--green);
      font-weight: 700;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      main { width: min(100% - 20px, 1480px); }
      .wave-head { align-items: flex-start; flex-direction: column; }
      .caption { grid-template-columns: 1fr; }
      .viewport { min-height: 260px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>SA_TOP 仿真波形</h1>
    <p>2026-10-24 虚拟机 VCS 实测 FSDB、原生 Verdi nWave 截图；六组均通过，显示全部 19 个现有 SA 端口。</p>
  </header>

  <main>
    <div class="tabs" role="tablist" aria-label="仿真模式"></div>
    <section class="wave-card">
      <div class="wave-head">
        <div>
          <h2 class="wave-title"></h2>
          <div class="wave-meta"></div>
        </div>
        <div class="tools">
          <button class="tool" type="button" data-action="minus" title="缩小" aria-label="缩小">−</button>
          <button class="tool" type="button" data-action="fit" title="适合窗口">适合</button>
          <button class="tool" type="button" data-action="plus" title="放大" aria-label="放大">＋</button>
          <a class="open-link" target="_blank" rel="noopener">细节原图</a>
          <a class="full-link open-link-style" target="_blank" rel="noopener">全程原图</a>
          <a class="log-link open-link-style" target="_blank" rel="noopener">VCS 日志</a>
        </div>
      </div>
      <div class="viewport">
        <img alt="">
      </div>
      <div class="caption">
        <div class="caption-text"></div>
        <div class="check-count"></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const cases = [
        {
                "id": "fp16",
                "label": "FP16",
                "mode": "cpu_cpt_mode=2'b10",
                "latency": "PE 7 拍 + SA 暂存 15 拍",
                "image": "./sim/fp16.png?v=90aa9abd3f35",
                "fullImage": "./sim/fp16_full.png?v=7c3a208f60f1",
                "log": "./sim/logs/sa_top_tb_fp16_run.log",
                "checks": "18 个任务 / 2478 个结果 / PASS",
                "caption": "本次 VCS 回归覆盖 H=W 1/4/16、连续包长 1/2/4/16/31/64，独立矩阵参考模型检查 2478 个结果，其中 672 个合法零值，共 3330 项检查。截图为最后一个 H=W=16、包长 64 的实际 FSDB；SA 输出在原 PE 波前之后暂存 15 拍。"
        },
        {
                "id": "int8",
                "label": "INT8",
                "mode": "cpu_cpt_mode=2'b01",
                "latency": "PE 1 拍 + SA 暂存 15 拍",
                "image": "./sim/int8.png?v=8f00cb42b21f",
                "fullImage": "./sim/int8_full.png?v=97f8a8305e96",
                "log": "./sim/logs/sa_top_tb_int8_run.log",
                "checks": "18 个任务 / 2478 个结果 / PASS",
                "caption": "本次 VCS 回归覆盖 H=W 1/4/16、连续包长 1/2/4/16/31/64，独立矩阵参考模型检查 2478 个结果，其中 692 个合法零值，共 3006 项检查。截图为最后一个 H=W=16、包长 64 的实际 FSDB；SA 输出在原 PE 波前之后暂存 15 拍。"
        },
        {
                "id": "multi",
                "label": "Multi",
                "mode": "cpu_cpt_mode=2'b00",
                "latency": "连续复用 EN，54 个可变包长任务",
                "image": "./sim/multi.png?v=9634788d2580",
                "fullImage": "./sim/multi_full.png?v=68a10c3d8d68",
                "log": "./sim/logs/sa_top_tb_multi_run.log",
                "checks": "54 个任务 / 7434 个结果 / PASS",
                "caption": "在 EN 持续有效且不复位的条件下，重复三轮尺寸与包长组合。本次 VCS 回归覆盖 H=W 1/4/16、连续包长 1/2/4/16/31/64，独立矩阵参考模型检查 7434 个结果，其中 2101 个合法零值，共 9018 项检查。截图为最后一个 H=W=16、包长 64 的实际 FSDB；SA 输出在原 PE 波前之后暂存 15 拍。"
        },
        {
                "id": "fp32",
                "label": "FP32",
                "mode": "cpu_cpt_mode=2'b11",
                "latency": "PE 4 拍 + SA 暂存 15 拍",
                "image": "./sim/fp32.png?v=436bda0fa594",
                "fullImage": "./sim/fp32_full.png?v=eff05710561b",
                "log": "./sim/logs/sa_top_tb_fp32_run.log",
                "checks": "18 个任务 / 2478 个结果 / PASS",
                "caption": "本次 VCS 回归覆盖 H=W 1/4/16、连续包长 1/2/4/16/31/64，独立矩阵参考模型检查 2478 个结果，其中 672 个合法零值，共 3168 项检查。截图为最后一个 H=W=16、包长 64 的实际 FSDB；SA 输出在原 PE 波前之后暂存 15 拍。"
        },
        {
                "id": "int4",
                "label": "INT4",
                "mode": "cpu_cpt_mode=2'b00",
                "latency": "PE 1 拍 + SA 暂存 15 拍",
                "image": "./sim/int4.png?v=b73515988962",
                "fullImage": "./sim/int4_full.png?v=465172492578",
                "log": "./sim/logs/sa_top_tb_int4_run.log",
                "checks": "18 个任务 / 2478 个结果 / PASS",
                "caption": "本次 VCS 回归覆盖 H=W 1/4/16、连续包长 1/2/4/16/31/64，独立矩阵参考模型检查 2478 个结果，其中 702 个合法零值，共 3006 项检查。截图为最后一个 H=W=16、包长 64 的实际 FSDB；SA 输出在原 PE 波前之后暂存 15 拍。"
        },
        {
                "id": "smoke",
                "label": "Smoke",
                "mode": "物理 ARRAY_H=ARRAY_W=1",
                "latency": "PE 1 拍；物理 1×1 额外暂存 0 拍",
                "image": "./sim/smoke.png?v=7639a7d2ed8c",
                "fullImage": "./sim/smoke_full.png?v=e484d547d888",
                "log": "./sim/logs/sa_top_tb_smoke_run.log",
                "checks": "固定 7×3=21；PASS",
                "caption": "真实物理 1×1 冒烟任务，输出 21 并同拍携带 LAST；该配置的 Skew 尾部为 0，因此无需新增暂存延迟。"
        }
];

      const tabs = document.querySelector(".tabs");
      const title = document.querySelector(".wave-title");
      const meta = document.querySelector(".wave-meta");
      const image = document.querySelector(".viewport img");
      const viewport = document.querySelector(".viewport");
      const caption = document.querySelector(".caption-text");
      const checks = document.querySelector(".check-count");
      const openLink = document.querySelector(".open-link");
      let active = cases[0];
      let zoom = 1;

      function drawTabs() {
        tabs.innerHTML = "";
        cases.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `tab${item === active ? " active" : ""}`;
          button.textContent = item.label;
          button.addEventListener("click", () => {
            active = item;
            zoom = 1;
            render();
          });
          tabs.appendChild(button);
        });
      }

      function render() {
        drawTabs();
        title.textContent = `${active.label} 顶层回归`;
        meta.innerHTML = `<span class="tag">${active.mode}</span><span class="tag">${active.latency}</span><span class="tag pass">PASS</span>`;
        image.src = active.image;
        image.alt = `${active.label} SA_TOP 仿真波形`;
        image.style.transform = `scale(${zoom})`;
        image.style.marginBottom = `${Math.max(0, image.offsetHeight * (zoom - 1))}px`;
        openLink.href = active.image;
        document.querySelector(".full-link").href = active.fullImage;
        document.querySelector(".log-link").href = active.log;
        caption.innerHTML = `<b>结果：</b>${active.caption}`;
        checks.textContent = active.checks;
        viewport.scrollTo({ left: 0, top: 0 });
      }

      document.querySelector('[data-action="minus"]').addEventListener("click", () => {
        zoom = Math.max(0.4, +(zoom - 0.1).toFixed(1));
        render();
      });

      document.querySelector('[data-action="plus"]').addEventListener("click", () => {
        zoom = Math.min(1.8, +(zoom + 0.1).toFixed(1));
        render();
      });

      document.querySelector('[data-action="fit"]').addEventListener("click", () => {
        zoom = Math.max(0.4, Math.min(1, (viewport.clientWidth - 28) / 2048));
        render();
      });

      image.addEventListener("load", () => {
        image.style.marginBottom = `${Math.max(0, image.offsetHeight * (zoom - 1))}px`;
      });

      render();
    })();
  </script>
</body>
</html>
