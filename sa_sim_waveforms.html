<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA_TOP 仿真波形</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #64748b;
      --line: #d7dde7;
      --blue: #1d4ed8;
      --blue-soft: #eef5ff;
      --green: #047857;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    header {
      padding: 22px 24px 17px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0;
    }

    header p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      width: min(1480px, calc(100% - 32px));
      margin: 20px auto 36px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .tab {
      min-width: 90px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #334155;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    .tab.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: var(--blue);
    }

    .wave-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.07);
    }

    .wave-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
    }

    .wave-title {
      margin: 0;
      font-size: 18px;
    }

    .wave-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .tag {
      padding: 3px 7px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      color: #475569;
      font-size: 12px;
    }

    .tag.pass {
      border-color: #a7f3d0;
      background: #ecfdf5;
      color: var(--green);
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .tool,
    .open-link, .open-link-style {
      display: inline-grid;
      min-width: 34px;
      height: 34px;
      place-items: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #334155;
      font: inherit;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }

    .tool:hover,
    .open-link:hover { border-color: #94a3b8; }

    .viewport {
      overflow: auto;
      min-height: 330px;
      padding: 14px;
      background: #0b0f13;
    }

    .viewport img {
      display: block;
      width: auto;
      max-width: none;
      height: auto;
      transform-origin: left top;
    }

    .caption {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      padding: 14px 18px 16px;
      border-top: 1px solid var(--line);
      color: #475569;
      font-size: 14px;
      line-height: 1.7;
    }

    .caption b { color: var(--ink); }

    .check-count {
      align-self: start;
      color: var(--green);
      font-weight: 700;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      main { width: min(100% - 20px, 1480px); }
      .wave-head { align-items: flex-start; flex-direction: column; }
      .caption { grid-template-columns: 1fr; }
      .viewport { min-height: 260px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>SA_TOP 仿真波形</h1>
    <p>本次尺寸上报修正后的六组SA仿真：复位0、START锁存、EN上升清零。六个顶层与三个单元测试均实际VCS通过，12张新原生100%波形只显示18个外部端口。</p>
  </header>

  <main>
    <div class="tabs" role="tablist" aria-label="仿真模式"></div>
    <section class="wave-card">
      <div class="wave-head">
        <div>
          <h2 class="wave-title"></h2>
          <div class="wave-meta"></div>
        </div>
        <div class="tools">
          <button class="tool" type="button" data-action="minus" title="缩小" aria-label="缩小">−</button>
          <button class="tool" type="button" data-action="fit" title="适合窗口">适合</button>
          <button class="tool" type="button" data-action="plus" title="放大" aria-label="放大">＋</button>
          <button class="tool" type="button" data-action="actual" title="原始像素显示">100%</button>
          <a class="open-link" target="_blank" rel="noopener">细节原图</a>
          <a class="full-link open-link-style" target="_blank" rel="noopener">全程原图</a>
          <a class="open-link-style" href="sa_august_comparison.html">与八月版对照</a>
          <a class="log-link open-link-style" target="_blank" rel="noopener">VCS 日志</a>
        </div>
      </div>
      <div class="viewport">
        <img alt="">
      </div>
      <div class="caption">
        <div class="caption-text"></div>
        <div class="check-count"></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const cases = [{"id": "fp16", "label": "FP16", "mode": "cpu_cpt_mode=2'b10", "latency": "沿用零点前PE与收集器时序，无新增结果延迟", "image": "./sim/fp16.png?v=66910fe5d87d", "fullImage": "./sim/fp16_full.png?v=4dbc260847d8", "log": "./sim/logs/sa_top_tb_fp16_run.log", "checks": "PASS jobs=9 results=1008 valid_zeros=315 checks=8010", "caption": "本次VCS FSDB原生100%截图，仅18个SA外部端口。尺寸上报复位为0，EN上升清零，START锁存实际H/W；其余时刻保持。PE、SA_CTRL和收集器数值通路未改。"}, {"id": "int8", "label": "INT8", "mode": "cpu_cpt_mode=2'b01", "latency": "沿用零点前PE与收集器时序，无新增结果延迟", "image": "./sim/int8.png?v=b6cdc4bcae30", "fullImage": "./sim/int8_full.png?v=166f776d1f30", "log": "./sim/logs/sa_top_tb_int8_run.log", "checks": "PASS jobs=9 results=1008 valid_zeros=330 checks=7794", "caption": "本次VCS FSDB原生100%截图，仅18个SA外部端口。尺寸上报复位为0，EN上升清零，START锁存实际H/W；其余时刻保持。PE、SA_CTRL和收集器数值通路未改。"}, {"id": "multi", "label": "MULTI", "mode": "cpu_cpt_mode=2'b00", "latency": "沿用零点前PE与收集器时序，无新增结果延迟", "image": "./sim/multi.png?v=ccb52d8176f7", "fullImage": "./sim/multi_full.png?v=3c0b21c9ff91", "log": "./sim/logs/sa_top_tb_multi_run.log", "checks": "PASS jobs=27 results=3024 valid_zeros=974 checks=23364", "caption": "本次VCS FSDB原生100%截图，仅18个SA外部端口。尺寸上报复位为0，EN上升清零，START锁存实际H/W；其余时刻保持。PE、SA_CTRL和收集器数值通路未改。"}, {"id": "fp32", "label": "FP32", "mode": "cpu_cpt_mode=2'b11", "latency": "沿用零点前PE与收集器时序，无新增结果延迟", "image": "./sim/fp32.png?v=f7005c5610f3", "fullImage": "./sim/fp32_full.png?v=4f1e5c865eea", "log": "./sim/logs/sa_top_tb_fp32_run.log", "checks": "PASS jobs=9 results=1008 valid_zeros=315 checks=7902", "caption": "本次VCS FSDB原生100%截图，仅18个SA外部端口。尺寸上报复位为0，EN上升清零，START锁存实际H/W；其余时刻保持。PE、SA_CTRL和收集器数值通路未改。"}, {"id": "int4", "label": "INT4", "mode": "cpu_cpt_mode=2'b00", "latency": "沿用零点前PE与收集器时序，无新增结果延迟", "image": "./sim/int4.png?v=abec218b4d0c", "fullImage": "./sim/int4_full.png?v=cbb11b1a6679", "log": "./sim/logs/sa_top_tb_int4_run.log", "checks": "PASS jobs=9 results=1008 valid_zeros=326 checks=7794", "caption": "本次VCS FSDB原生100%截图，仅18个SA外部端口。尺寸上报复位为0，EN上升清零，START锁存实际H/W；其余时刻保持。PE、SA_CTRL和收集器数值通路未改。"}, {"id": "smoke", "label": "SMOKE", "mode": "物理1×1", "latency": "沿用零点前PE与收集器时序，无新增结果延迟", "image": "./sim/smoke.png?v=50c5356dc72d", "fullImage": "./sim/smoke_full.png?v=176fd90c711d", "log": "./sim/logs/sa_top_tb_smoke_run.log", "checks": "7×3=21；物理1×1；PASS", "caption": "本次VCS FSDB原生100%截图，仅18个SA外部端口。尺寸上报复位为0，EN上升清零，START锁存实际H/W；其余时刻保持。PE、SA_CTRL和收集器数值通路未改。"}];

      const tabs = document.querySelector(".tabs");
      const title = document.querySelector(".wave-title");
      const meta = document.querySelector(".wave-meta");
      const image = document.querySelector(".viewport img");
      const viewport = document.querySelector(".viewport");
      const caption = document.querySelector(".caption-text");
      const checks = document.querySelector(".check-count");
      const openLink = document.querySelector(".open-link");
      let active = cases[0];
      let zoom = 1;

      function drawTabs() {
        tabs.innerHTML = "";
        cases.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `tab${item === active ? " active" : ""}`;
          button.textContent = item.label;
          button.addEventListener("click", () => {
            active = item;
            zoom = 1;
            render();
          });
          tabs.appendChild(button);
        });
      }

      function render() {
        drawTabs();
        title.textContent = `${active.label} 顶层回归`;
        meta.innerHTML = `<span class="tag">${active.mode}</span><span class="tag">${active.latency}</span><span class="tag pass">PASS</span>`;
        image.src = active.image;
        image.alt = `${active.label} SA_TOP 仿真波形`;
        image.style.transform = `scale(${zoom})`;
        image.style.marginBottom = `${Math.max(0, image.offsetHeight * (zoom - 1))}px`;
        openLink.href = active.image;
        document.querySelector(".full-link").href = active.fullImage;
        document.querySelector(".log-link").href = active.log;
        caption.innerHTML = `<b>结果：</b>${active.caption}`;
        checks.textContent = active.checks;
        viewport.scrollTo({ left: 0, top: 0 });
      }

      document.querySelector('[data-action="minus"]').addEventListener("click", () => {
        zoom = Math.max(0.4, +(zoom - 0.1).toFixed(1));
        render();
      });

      document.querySelector('[data-action="plus"]').addEventListener("click", () => {
        zoom = Math.min(1.8, +(zoom + 0.1).toFixed(1));
        render();
      });

      document.querySelector('[data-action="fit"]').addEventListener("click", () => {
        zoom = Math.max(0.4, Math.min(1, (viewport.clientWidth - 28) / (image.naturalWidth || 1800)));
        render();
      });

      document.querySelector('[data-action="actual"]').addEventListener("click", () => { zoom = 1; render(); });

      image.addEventListener("load", () => {
        image.style.marginBottom = `${Math.max(0, image.offsetHeight * (zoom - 1))}px`;
      });

      render();
    })();
  </script>
</body>
</html>
