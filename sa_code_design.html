<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA_TOP RTL / TB 代码设计</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #64748b;
      --line: #d7dde7;
      --blue: #1d4ed8;
      --blue-soft: #eef5ff;
      --code: #0b1020;
      --code-line: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 24px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 25px;
      letter-spacing: 0;
    }

    .subtitle,
    .file-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .stats {
      display: flex;
      gap: 18px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      min-height: calc(100vh - 91px);
    }

    aside {
      border-right: 1px solid var(--line);
      background: #fff;
      padding: 14px 12px 24px;
    }

    .filter {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      outline: none;
    }

    .filter:focus { border-color: #93c5fd; }

    .group-title {
      margin: 18px 8px 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .file-button {
      display: block;
      overflow: hidden;
      width: 100%;
      min-height: 34px;
      border: 0;
      border-radius: 5px;
      padding: 7px 9px;
      background: transparent;
      color: #334155;
      font: 12px/1.45 Consolas, "Cascadia Mono", monospace;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .file-button:hover { background: #f3f4f6; }

    .file-button.active {
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 700;
    }

    .code-panel {
      min-width: 0;
      padding: 16px 18px 26px;
    }

    .code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 7px 7px 0 0;
      background: #fff;
    }

    .file-path {
      margin-bottom: 3px;
      font: 700 14px Consolas, "Cascadia Mono", monospace;
    }

    .actions { display: flex; gap: 7px; }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: #334155;
      font: inherit;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .action:hover { background: #f8fafc; color: var(--ink); }

    .code-scroll {
      overflow: auto;
      height: calc(100vh - 183px);
      min-height: 620px;
      border: 1px solid #111827;
      border-radius: 0 0 7px 7px;
      background: var(--code);
    }

    .code-lines {
      min-width: max-content;
      margin: 0;
      padding: 14px 20px 20px 66px;
      color: var(--code-line);
      font: 13px/1.65 Consolas, "Cascadia Mono", monospace;
      white-space: pre;
    }

    .code-lines li {
      min-height: 21px;
      padding-left: 14px;
      border-left: 1px solid #27324a;
    }

    .code-lines li::marker { color: #6b7280; }

    .empty {
      padding: 14px 9px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .page-head { align-items: flex-start; flex-direction: column; }
      .stats { flex-wrap: wrap; white-space: normal; }
      .workspace { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .file-tree { max-height: 280px; overflow: auto; }
      .code-panel { padding: 12px; }
      .code-head { align-items: flex-start; flex-direction: column; }
      .code-scroll { height: 720px; min-height: 0; }
    }
  </style>
</head>
<body>
  <header class="page-head">
    <div>
      <h1>SA_TOP RTL / TB 代码设计</h1>
      <div class="subtitle">当前 SA 与 TPU_CTRL 交付代码：Makefile、RTL、自检 TB；仿真波形保持历史版本。</div>
    </div>
    <div class="stats"><span>RTL：11个文件</span><span>TB：11个文件</span><span>构建：1个文件</span><span>TPU_CTRL：8个文件</span></div>
  </header>

  <div class="workspace">
    <aside>
      <input class="filter" id="file-filter" type="search" placeholder="筛选文件" aria-label="筛选文件">
      <div class="file-tree" id="file-tree"></div>
    </aside>

    <main class="code-panel">
      <div class="code-head">
        <div>
          <div class="file-path" id="file-path">rtl/sa_top.sv</div>
          <div class="file-meta" id="file-meta">顶层端口与三个子模块的互连</div>
        </div>
        <div class="actions">
          <button class="action" id="copy-code" type="button">复制代码</button>
          <a class="action" id="raw-link" href="./code/rtl/sa_top.sv" target="_blank" rel="noopener">原始文件</a>
        </div>
      </div>
      <div class="code-scroll">
        <ol class="code-lines" id="code-lines"></ol>
      </div>
    </main>
  </div>

  <script>
    (() => {
      const files = [
        {
                "group": "构建",
                "path": "Makefile",
                "desc": "工程源文件"
        },
        {
                "group": "RTL",
                "path": "rtl/filelist.f",
                "desc": "工程源文件"
        },
        {
                "group": "RTL",
                "path": "rtl/output_collector.sv",
                "desc": "最终结果逐列输出、valid历史与LAST倒计时"
        },
        {
                "group": "RTL",
                "path": "rtl/pe_array_16x16.sv",
                "desc": "工程源文件"
        },
        {
                "group": "RTL",
                "path": "rtl/pe_mp/fix2fp.v",
                "desc": "工程源文件"
        },
        {
                "group": "RTL",
                "path": "rtl/pe_mp/fp2fix.v",
                "desc": "工程源文件"
        },
        {
                "group": "RTL",
                "path": "rtl/pe_mp/fp32_adder.v",
                "desc": "工程源文件"
        },
        {
                "group": "RTL",
                "path": "rtl/pe_mp/fp32_multi.v",
                "desc": "工程源文件"
        },
        {
                "group": "RTL",
                "path": "rtl/pe_mp/PE_MP_v1.v",
                "desc": "工程源文件"
        },
        {
                "group": "RTL",
                "path": "rtl/sa_ctrl.sv",
                "desc": "工程源文件"
        },
        {
                "group": "RTL",
                "path": "rtl/sa_top.sv",
                "desc": "SA 顶层、新增原始向量标记与流水反馈"
        },
        {
                "group": "RTL",
                "path": "rtl/vcs_filelist.f",
                "desc": "工程源文件"
        },
        {
                "group": "TB",
                "path": "tb/output_collector_tb.sv",
                "desc": "逐列valid、补零与LAST单元测试"
        },
        {
                "group": "TB",
                "path": "tb/pe_array_16x16_tb.sv",
                "desc": "工程源文件"
        },
        {
                "group": "TB",
                "path": "tb/sa_ctrl_tb.sv",
                "desc": "工程源文件"
        },
        {
                "group": "TB",
                "path": "tb/sa_top_case_runner.sv",
                "desc": "连续16向量、H=W、气泡及完整结果自检"
        },
        {
                "group": "TB",
                "path": "tb/sa_top_tb_fp16.sv",
                "desc": "工程源文件"
        },
        {
                "group": "TB",
                "path": "tb/sa_top_tb_fp32.sv",
                "desc": "工程源文件"
        },
        {
                "group": "TB",
                "path": "tb/sa_top_tb_int4.sv",
                "desc": "工程源文件"
        },
        {
                "group": "TB",
                "path": "tb/sa_top_tb_int8.sv",
                "desc": "工程源文件"
        },
        {
                "group": "TB",
                "path": "tb/sa_top_tb_multi.sv",
                "desc": "连续任务与无复位重复输入"
        },
        {
                "group": "TB",
                "path": "tb/sa_top_tb_smoke.sv",
                "desc": "工程源文件"
        },
        {
                "group": "TB",
                "path": "tb/vcs_sa_top_tb_smoke.f",
                "desc": "工程源文件"
        },
        {
                "group": "TPU_CTRL",
                "path": "TPU_CTRL/Makefile",
                "desc": "CTRL make all / make verdi 入口"
        },
        {
                "group": "TPU_CTRL",
                "path": "TPU_CTRL/README.md",
                "desc": "CTRL 独立工程运行说明"
        },
        {
                "group": "TPU_CTRL",
                "path": "TPU_CTRL/rtl/filelist.f",
                "desc": "CTRL相对路径编译清单"
        },
        {
                "group": "TPU_CTRL",
                "path": "TPU_CTRL/rtl/tpu_ctrl.sv",
                "desc": "任务、FIFO读取、计数与流水完成控制"
        },
        {
                "group": "TPU_CTRL",
                "path": "TPU_CTRL/rtl/tpu_ctrl_skew.sv",
                "desc": "16路逐行延迟与空白补零"
        },
        {
                "group": "TPU_CTRL",
                "path": "TPU_CTRL/rtl/tpu_ctrl_sync.sv",
                "desc": "EN/START两拍同步"
        },
        {
                "group": "TPU_CTRL",
                "path": "TPU_CTRL/scripts/check_license.sh",
                "desc": "沿用既有工程的VCS许可检查"
        },
        {
                "group": "TPU_CTRL",
                "path": "TPU_CTRL/tb/tb_tpu_ctrl.sv",
                "desc": "CTRL独立自检、提前LAST与流水排空"
        }
];

      const tree = document.getElementById("file-tree");
      const filter = document.getElementById("file-filter");
      const pathLabel = document.getElementById("file-path");
      const metaLabel = document.getElementById("file-meta");
      const linesRoot = document.getElementById("code-lines");
      const rawLink = document.getElementById("raw-link");
      const copyButton = document.getElementById("copy-code");
      let activePath = "rtl/sa_top.sv";
      let activeText = "";

      const renderTree = () => {
        const query = filter.value.trim().toLowerCase();
        tree.replaceChildren();
        ["构建", "RTL", "TB", "TPU_CTRL"].forEach((group) => {
          const entries = files.filter((file) => file.group === group && file.path.toLowerCase().includes(query));
          if (!entries.length) return;
          const title = document.createElement("div");
          title.className = "group-title";
          title.textContent = group;
          tree.appendChild(title);
          entries.forEach((file) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = `file-button${file.path === activePath ? " active" : ""}`;
            button.textContent = file.path;
            button.title = file.desc;
            button.addEventListener("click", () => loadFile(file));
            tree.appendChild(button);
          });
        });
        if (!tree.children.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "没有匹配文件";
          tree.appendChild(empty);
        }
      };

      const renderCode = (text) => {
        linesRoot.replaceChildren();
        text.replace(/\r\n/g, "\n").split("\n").forEach((line) => {
          const item = document.createElement("li");
          const code = document.createElement("code");
          code.textContent = line || " ";
          item.appendChild(code);
          linesRoot.appendChild(item);
        });
      };

      const loadFile = async (file) => {
        activePath = file.path;
        pathLabel.textContent = file.path;
        metaLabel.textContent = `${file.desc} · 加载中`;
        rawLink.href = `./code/${file.path}`;
        renderTree();
        try {
          const response = await fetch(`./code/${file.path}?release=collector-stream-20261011`);
          if (!response.ok) throw new Error(String(response.status));
          activeText = await response.text();
          renderCode(activeText);
          const lineCount = activeText.replace(/\r\n/g, "\n").split("\n").length;
          metaLabel.textContent = `${file.desc} · ${lineCount}行`;
          history.replaceState(null, "", `?file=${encodeURIComponent(file.path)}`);
        } catch (error) {
          activeText = "";
          renderCode("文件加载失败");
          metaLabel.textContent = `${file.desc} · 加载失败`;
        }
      };

      copyButton.addEventListener("click", async () => {
        if (!activeText) return;
        await navigator.clipboard.writeText(activeText);
        copyButton.textContent = "已复制";
        setTimeout(() => { copyButton.textContent = "复制代码"; }, 1200);
      });

      filter.addEventListener("input", renderTree);
      const requested = new URLSearchParams(location.search).get("file");
      const initial = files.find((file) => file.path === requested) || files.find((file) => file.path === activePath);
      renderTree();
      loadFile(initial);
    })();
  </script>
</body>
</html>
