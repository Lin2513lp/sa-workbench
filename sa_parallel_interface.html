  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;sa-parallel-interface-stream&quot;&gt;
  &lt;style&gt;
    #sa-parallel-interface-stream {
      width: 100%;
      color: var(--foreground);
    }

    #sa-parallel-interface-stream .sa-controls {
      align-items: end;
      margin-bottom: 0.8rem;
    }

    #sa-parallel-interface-stream .sa-clock-control {
      flex: 1 1 300px;
      min-width: 0;
    }

    #sa-parallel-interface-stream .sa-speed-control {
      flex: 0 1 110px;
    }

    #sa-parallel-interface-stream .sa-milestones {
      margin-bottom: 0.9rem;
    }

    #sa-parallel-interface-stream .sa-section {
      margin: 0.8rem 0;
    }

    #sa-parallel-interface-stream .sa-section-label {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.35rem 0.75rem;
      margin-bottom: 0.35rem;
      font-weight: 500;
    }

    #sa-parallel-interface-stream .sa-muted {
      color: var(--muted-foreground);
      font-weight: 400;
    }

    #sa-parallel-interface-stream .sa-beats {
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 3px;
      width: 100%;
    }

    #sa-parallel-interface-stream .sa-beat {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      height: 22px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: color-mix(in srgb, var(--muted) 44%, transparent);
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }

    #sa-parallel-interface-stream .sa-beat[data-state=&quot;accepted&quot;] {
      border-color: color-mix(in srgb, var(--viz-series-1) 36%, var(--border));
      background: color-mix(in srgb, var(--viz-series-1) 18%, transparent);
    }

    #sa-parallel-interface-stream .sa-beat[data-state=&quot;current&quot;] {
      border-color: color-mix(in srgb, var(--viz-series-1) 70%, var(--border));
      background: var(--viz-series-1);
      color: var(--foreground);
    }

    #sa-parallel-interface-stream .sa-vector {
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 3px;
      width: 100%;
    }

    #sa-parallel-interface-stream .sa-vector.is-entering {
      animation: sa-vector-enter 320ms ease-out;
    }

    #sa-parallel-interface-stream .sa-lane {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      height: clamp(44px, 6vw, 58px);
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--viz-series-1) 65%, var(--border));
      border-radius: 2px;
      background: var(--viz-series-1);
      color: var(--foreground);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #sa-parallel-interface-stream .sa-lane small {
      max-width: 100%;
      overflow: hidden;
      color: var(--muted-foreground);
      text-overflow: ellipsis;
    }

    #sa-parallel-interface-stream .sa-lane[data-valid=&quot;false&quot;] {
      border-color: var(--border);
      background: color-mix(in srgb, var(--muted) 44%, transparent);
      color: var(--muted-foreground);
    }

    #sa-parallel-interface-stream .sa-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 34px;
      color: var(--muted-foreground);
    }

    #sa-parallel-interface-stream .sa-array-wrap {
      position: relative;
      width: min(100%, 560px);
      margin: 0 auto;
    }

    #sa-parallel-interface-stream .sa-array {
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 3px;
      width: 100%;
      aspect-ratio: 1;
    }

    #sa-parallel-interface-stream .sa-pe {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: color-mix(in srgb, var(--muted) 44%, transparent);
    }

    #sa-parallel-interface-stream .sa-array-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: color-mix(in srgb, var(--background) 78%, transparent);
      color: var(--foreground);
      text-align: center;
      pointer-events: none;
    }

    #sa-parallel-interface-stream .sa-array-overlay[data-receiving=&quot;true&quot;] {
      background: color-mix(in srgb, var(--viz-series-1) 22%, var(--background));
    }

    #sa-parallel-interface-stream .sa-array-overlay strong {
      font-weight: 500;
    }

    #sa-parallel-interface-stream .sa-output-row {
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 3px;
      width: 100%;
    }

    #sa-parallel-interface-stream .sa-output-lane {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      height: 34px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: color-mix(in srgb, var(--muted) 44%, transparent);
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #sa-parallel-interface-stream .sa-facts {
      justify-content: flex-start;
      margin-top: 0.8rem;
    }

    #sa-parallel-interface-stream .sa-readout {
      margin-top: 0.8rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border);
    }

    @keyframes sa-vector-enter {
      from {
        transform: translateX(-24px);
      }
      to {
        transform: translateX(0);
      }
    }

    @media (max-width: 520px) {
      #sa-parallel-interface-stream .sa-lane small,
      #sa-parallel-interface-stream .sa-lane span,
      #sa-parallel-interface-stream .sa-output-lane span {
        display: none;
      }

      #sa-parallel-interface-stream .sa-array {
        gap: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #sa-parallel-interface-stream .sa-vector.is-entering {
        animation: none;
      }
    }
  &lt;/style&gt;

  &lt;div class=&quot;viz-controls sa-controls&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;sa-parallel-play&quot;&gt;
      &lt;i data-lucide=&quot;play&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
      &lt;span&gt;播放&lt;/span&gt;
    &lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;sa-parallel-prev&quot; aria-label=&quot;上一拍&quot; data-tooltip=&quot;上一拍&quot;&gt;
      &lt;i data-lucide=&quot;step-back&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
    &lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;sa-parallel-next&quot; aria-label=&quot;下一拍&quot; data-tooltip=&quot;下一拍&quot;&gt;
      &lt;i data-lucide=&quot;step-forward&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
    &lt;/button&gt;
    &lt;label class=&quot;form-label sa-clock-control&quot;&gt;
      输入拍：&lt;span id=&quot;sa-parallel-clock&quot;&gt;等待 dat_in_vld&lt;/span&gt;
      &lt;input class=&quot;form-range&quot; id=&quot;sa-parallel-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;16&quot; value=&quot;0&quot; step=&quot;1&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label sa-speed-control&quot;&gt;
      速度
      &lt;select class=&quot;form-select&quot; id=&quot;sa-parallel-speed&quot;&gt;
        &lt;option value=&quot;1200&quot;&gt;0.5×&lt;/option&gt;
        &lt;option value=&quot;700&quot; selected&gt;1×&lt;/option&gt;
        &lt;option value=&quot;350&quot;&gt;2×&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-row sa-milestones&quot; aria-label=&quot;输入关键拍&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-parallel-beat=&quot;1&quot;&gt;第1拍&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-parallel-beat=&quot;8&quot;&gt;第8拍&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-parallel-beat=&quot;16&quot;&gt;第16拍 · dat_in_last&lt;/button&gt;
  &lt;/div&gt;

  &lt;section class=&quot;sa-section&quot; aria-labelledby=&quot;sa-parallel-progress-label&quot;&gt;
    &lt;div class=&quot;sa-section-label&quot;&gt;
      &lt;span id=&quot;sa-parallel-progress-label&quot;&gt;示例：16个输入beat&lt;/span&gt;
      &lt;span class=&quot;sa-muted&quot;&gt;每个小格都代表一个完整的512-bit传输&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;sa-parallel-beats&quot; class=&quot;sa-beats&quot; role=&quot;img&quot; aria-label=&quot;16个512位输入beat的接收进度&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;sa-section&quot; aria-labelledby=&quot;sa-parallel-input-label&quot;&gt;
    &lt;div class=&quot;sa-section-label&quot;&gt;
      &lt;span id=&quot;sa-parallel-input-label&quot;&gt;&lt;code&gt;dat_in_a[511:0]&lt;/code&gt; · 本拍整体输入&lt;/span&gt;
      &lt;span id=&quot;sa-parallel-input-status&quot; class=&quot;sa-muted&quot;&gt;16条32-bit lane在同一个时钟沿锁存&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;sa-parallel-vector&quot; class=&quot;sa-vector&quot; role=&quot;img&quot; aria-label=&quot;当前拍同时输入的16个32位A数据&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;sa-flow&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;span&gt;整排16个数据一起移动&lt;/span&gt;
    &lt;i data-lucide=&quot;arrow-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
    &lt;span&gt;不是在同一PE行中逐格填入&lt;/span&gt;
  &lt;/div&gt;

  &lt;section class=&quot;sa-section&quot; aria-labelledby=&quot;sa-parallel-array-label&quot;&gt;
    &lt;div class=&quot;sa-section-label&quot;&gt;
      &lt;span id=&quot;sa-parallel-array-label&quot;&gt;16×16 PE 阵列&lt;/span&gt;
      &lt;span class=&quot;sa-muted&quot;&gt;只显示已确认的接口接收行为&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sa-array-wrap&quot;&gt;
      &lt;div id=&quot;sa-parallel-array&quot; class=&quot;sa-array&quot; role=&quot;grid&quot; aria-label=&quot;16乘16 PE阵列，内部lane映射尚未签核&quot;&gt;&lt;/div&gt;
      &lt;div id=&quot;sa-parallel-overlay&quot; class=&quot;sa-array-overlay&quot; data-receiving=&quot;false&quot;&gt;
        &lt;strong&gt;lane到PE的映射、partial sum连接和内部传播拍数：待SA互连RTL定义&lt;/strong&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;sa-flow&quot; aria-hidden=&quot;true&quot;&gt;
    &lt;span&gt;阵列流水完成后&lt;/span&gt;
    &lt;i data-lucide=&quot;arrow-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
    &lt;span&gt;结果也按16-lane接口输出&lt;/span&gt;
  &lt;/div&gt;

  &lt;section class=&quot;sa-section&quot; aria-labelledby=&quot;sa-parallel-output-label&quot;&gt;
    &lt;div class=&quot;sa-section-label&quot;&gt;
      &lt;span id=&quot;sa-parallel-output-label&quot;&gt;&lt;code&gt;dat_out[511:0]&lt;/code&gt; · 16-lane 并行输出&lt;/span&gt;
      &lt;span class=&quot;sa-muted&quot;&gt;首输出拍与总延迟暂不写死&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;sa-parallel-output&quot; class=&quot;sa-output-row&quot; role=&quot;img&quot; aria-label=&quot;16条32位结果输出lane，具体有效周期待定&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;viz-row sa-facts&quot;&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;输入带宽：16×32-bit/拍&lt;/span&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;输入吞吐：1个512-bit beat/拍&lt;/span&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;总延迟：TBD&lt;/span&gt;
  &lt;/div&gt;

  &lt;div id=&quot;sa-parallel-readout&quot; class=&quot;sa-readout text-small&quot; aria-live=&quot;polite&quot;&gt;
    B 权重已经预加载；等待第一个512-bit A数据拍。
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;sa-parallel-interface-stream&quot;);
      if (!root) return;

      const size = 16;
      const finalBeat = 16;
      const beats = root.querySelector(&quot;#sa-parallel-beats&quot;);
      const vector = root.querySelector(&quot;#sa-parallel-vector&quot;);
      const array = root.querySelector(&quot;#sa-parallel-array&quot;);
      const output = root.querySelector(&quot;#sa-parallel-output&quot;);
      const overlay = root.querySelector(&quot;#sa-parallel-overlay&quot;);
      const inputStatus = root.querySelector(&quot;#sa-parallel-input-status&quot;);
      const range = root.querySelector(&quot;#sa-parallel-range&quot;);
      const clock = root.querySelector(&quot;#sa-parallel-clock&quot;);
      const readout = root.querySelector(&quot;#sa-parallel-readout&quot;);
      const playButton = root.querySelector(&quot;#sa-parallel-play&quot;);
      const playText = playButton.querySelector(&quot;span&quot;);
      const prevButton = root.querySelector(&quot;#sa-parallel-prev&quot;);
      const nextButton = root.querySelector(&quot;#sa-parallel-next&quot;);
      const speed = root.querySelector(&quot;#sa-parallel-speed&quot;);
      const beatCells = [];
      const laneCells = [];
      let currentBeat = 0;
      let timer = null;

      for (let i = 0; i &lt; size; i += 1) {
        const beatCell = document.createElement(&quot;span&quot;);
        beatCell.className = &quot;sa-beat&quot;;
        beatCell.dataset.beat = String(i + 1);
        beatCell.dataset.state = &quot;pending&quot;;
        beatCell.textContent = String(i + 1);
        beats.appendChild(beatCell);
        beatCells.push(beatCell);

        const lane = document.createElement(&quot;span&quot;);
        lane.className = &quot;sa-lane&quot;;
        lane.dataset.lane = String(i);
        lane.dataset.valid = &quot;false&quot;;
        lane.innerHTML = `&lt;small&gt;lane ${i}&lt;/small&gt;&lt;span&gt;—&lt;/span&gt;`;
        vector.appendChild(lane);
        laneCells.push(lane);

        const outputLane = document.createElement(&quot;span&quot;);
        outputLane.className = &quot;sa-output-lane&quot;;
        outputLane.innerHTML = `&lt;span&gt;lane ${i}: TBD&lt;/span&gt;`;
        output.appendChild(outputLane);
      }

      for (let i = 0; i &lt; size * size; i += 1) {
        const pe = document.createElement(&quot;span&quot;);
        pe.className = &quot;sa-pe&quot;;
        pe.setAttribute(&quot;role&quot;, &quot;gridcell&quot;);
        pe.setAttribute(&quot;aria-label&quot;, `PE ${Math.floor(i / size)}, ${i % size}，内部连接待定义`);
        array.appendChild(pe);
      }

      function restartVectorAnimation() {
        vector.classList.remove(&quot;is-entering&quot;);
        void vector.offsetWidth;
        vector.classList.add(&quot;is-entering&quot;);
      }

      function render(nextBeat) {
        currentBeat = Math.max(0, Math.min(finalBeat, nextBeat));
        range.value = String(currentBeat);
        clock.textContent = currentBeat === 0
          ? &quot;等待 dat_in_vld&quot;
          : `第 ${currentBeat} / ${finalBeat} 个输入beat`;

        beatCells.forEach((cell) =&gt; {
          const beat = Number(cell.dataset.beat);
          cell.dataset.state = beat &lt; currentBeat
            ? &quot;accepted&quot;
            : beat === currentBeat
              ? &quot;current&quot;
              : &quot;pending&quot;;
        });

        laneCells.forEach((cell) =&gt; {
          const lane = Number(cell.dataset.lane);
          const valid = currentBeat &gt; 0;
          cell.dataset.valid = String(valid);
          cell.querySelector(&quot;span&quot;).textContent = valid ? `A${currentBeat - 1},${lane}` : &quot;—&quot;;
          cell.setAttribute(
            &quot;aria-label&quot;,
            valid
              ? `第${currentBeat}拍，lane ${lane} 同时输入 A ${currentBeat - 1},${lane}`
              : `lane ${lane} 等待输入`
          );
        });

        overlay.dataset.receiving = String(currentBeat &gt; 0);
        overlay.querySelector(&quot;strong&quot;).textContent = currentBeat &gt; 0
          ? `第${currentBeat}拍：16条lane已被SA_TOP整体接收；内部连接与延迟仍待定义`
          : &quot;lane到PE的映射、partial sum连接和内部传播拍数：待SA互连RTL定义&quot;;

        if (currentBeat &gt; 0) {
          inputStatus.textContent = currentBeat === finalBeat
            ? &quot;dat_in_vld=1，dat_in_last=1，16条lane同拍锁存&quot;
            : &quot;dat_in_vld=1，16条lane同拍锁存&quot;;
          readout.textContent = `第${currentBeat}拍：dat_in_a一次传入 A[${currentBeat - 1}][0…15] 共16个32-bit数据。这里不假设它们随后如何分配到256个PE，也不计算未经签核的总周期。`;
          restartVectorAnimation();
        } else {
          inputStatus.textContent = &quot;16条32-bit lane在同一个时钟沿锁存&quot;;
          readout.textContent = &quot;B 权重已经预加载；等待第一个512-bit A数据拍。&quot;;
          vector.classList.remove(&quot;is-entering&quot;);
        }

        prevButton.disabled = currentBeat === 0;
        nextButton.disabled = currentBeat === finalBeat;
        root.querySelectorAll(&quot;[data-parallel-beat]&quot;).forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(Number(button.dataset.parallelBeat) === currentBeat));
        });
      }

      function stop() {
        if (timer !== null) {
          window.clearInterval(timer);
          timer = null;
        }
        playButton.classList.add(&quot;btn-primary&quot;);
        playText.textContent = &quot;播放&quot;;
        playButton.querySelector(&quot;svg, i&quot;)?.setAttribute(&quot;data-lucide&quot;, &quot;play&quot;);
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function start() {
        if (currentBeat &gt;= finalBeat) render(0);
        playText.textContent = &quot;暂停&quot;;
        playButton.querySelector(&quot;svg, i&quot;)?.setAttribute(&quot;data-lucide&quot;, &quot;pause&quot;);
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        timer = window.setInterval(() =&gt; {
          if (currentBeat &gt;= finalBeat) {
            stop();
            return;
          }
          render(currentBeat + 1);
        }, Number(speed.value));
      }

      playButton.addEventListener(&quot;click&quot;, () =&gt; {
        if (timer === null) start();
        else stop();
      });
      prevButton.addEventListener(&quot;click&quot;, () =&gt; {
        stop();
        render(currentBeat - 1);
      });
      nextButton.addEventListener(&quot;click&quot;, () =&gt; {
        stop();
        render(currentBeat + 1);
      });
      range.addEventListener(&quot;input&quot;, () =&gt; {
        stop();
        render(Number(range.value));
      });
      speed.addEventListener(&quot;change&quot;, () =&gt; {
        if (timer !== null) {
          stop();
          start();
        }
      });
      root.querySelectorAll(&quot;[data-parallel-beat]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          stop();
          render(Number(button.dataset.parallelBeat));
        });
      });

      render(0);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();

    .getElementById(&quot;codex-visualization-lucide&quot;)
